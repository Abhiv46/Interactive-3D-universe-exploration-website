<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Universe Explorer - Interactive 3D Solar System & Cosmos</title>
    <meta name="title" content="Universe Explorer - Interactive 3D Solar System & Cosmos" />
    <meta name="description" content="Explore the cosmos in 3D. Visit planets, moons, and deep space objects. Real-time positions, NASA APOD, guided tours, and more." />
    <meta name="keywords" content="universe, solar system, 3D, astronomy, planets, space, interactive, NASA, education" />
    <meta name="author" content="Universe Explorer" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://universe-explorer.vercel.app/" />
    <meta property="og:title" content="Universe Explorer - Interactive 3D Solar System & Cosmos" />
    <meta property="og:description" content="Explore the cosmos in 3D. Visit planets, moons, and deep space objects. Real-time positions, NASA APOD, guided tours, and more." />
    <meta property="og:image" content="https://universe-explorer.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Universe Explorer" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://universe-explorer.vercel.app/" />
    <meta name="twitter:title" content="Universe Explorer - Interactive 3D Solar System & Cosmos" />
    <meta name="twitter:description" content="Explore the cosmos in 3D. Visit planets, moons, and deep space objects. Real-time positions, NASA APOD, guided tours, and more." />
    <meta name="twitter:image" content="https://universe-explorer.vercel.app/og-image.png" />

    <!-- Additional SEO -->
    <link rel="canonical" href="https://universe-explorer.vercel.app/" />
    <link rel="sitemap" href="/sitemap.xml" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f0f1a" />
    <meta name="color-scheme" content="dark" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.nasa.gov" />
    <link rel="preconnect" href="https://images-api.nasa.gov" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://api.nasa.gov" />
    <link rel="dns-prefetch" href="https://images-api.nasa.gov" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
